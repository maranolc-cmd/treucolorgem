<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrueColorGem</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--black:#080808;--dark:#111;--card:#181818;--card2:#202020;--gold:#c9a84c;--gold-light:#e8c96a;--gold-dim:#6a5020;--gold-bg:rgba(201,168,76,0.07);--white:#f5f0e8;--grey:#777;--grey2:#444;--green:#4caf7d;--red:#e05555;--yellow:#f0c040;--blue:#5599dd}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--black);color:var(--white);font-family:'Montserrat',sans-serif;font-size:14px;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
input,textarea,select{font-family:'Montserrat',sans-serif;background:var(--card2);border:1px solid var(--grey2);color:var(--white);border-radius:3px;padding:12px 14px;font-size:13px;width:100%;outline:none;transition:border-color 0.2s}
input:focus,textarea:focus{border-color:var(--gold)}
label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--grey);display:block;margin-bottom:6px}
.field{margin-bottom:16px}

#s-welcome{background:radial-gradient(ellipse at 30% 20%,#1a1200 0%,#080808 65%);align-items:center;justify-content:center;text-align:center;padding:48px 28px;position:relative;overflow:hidden}
.gem-logo{width:88px;height:88px;margin:0 auto 28px}
.brand{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:300;letter-spacing:4px;color:var(--gold);line-height:1;margin-bottom:6px}
.brand-sub{font-size:9px;letter-spacing:7px;text-transform:uppercase;color:var(--grey);margin-bottom:52px}
.tagline{font-family:'Cormorant Garamond',serif;font-size:17px;font-style:italic;color:rgba(245,240,232,0.5);margin-bottom:60px;line-height:1.7}
.btn{border:none;border-radius:2px;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:3px;text-transform:uppercase;transition:all 0.2s;display:block;width:100%;max-width:300px;margin:0 auto}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:var(--black);padding:16px;font-size:11px}
.btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold-dim);padding:14px;font-size:11px;margin-top:12px}
.btn-grey{background:var(--card2);color:var(--white);border:1px solid var(--grey2);padding:14px;font-size:11px;margin-top:10px}

.nav{padding:18px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-back{background:none;border:none;color:var(--gold);cursor:pointer;font-size:22px}
.nav-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300}
.topbar{padding:18px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,0.12)}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dim),var(--gold));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--black)}

#s-camera{background:#000}
.cam-view{flex:1;background:#000;position:relative;overflow:hidden}
.cam-placeholder{font-size:120px;opacity:0.15}
.cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.cam-frame{width:230px;height:230px;border-radius:4px;position:relative;box-shadow:0 0 0 9999px rgba(0,0,0,0.55)}
.light-ind{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.75);padding:8px 16px;border-radius:20px}
.light-dot{width:10px;height:10px;border-radius:50%}
.light-txt{font-size:11px;letter-spacing:1px}
.cam-bottom{padding:22px 24px 40px;background:var(--black);display:flex;flex-direction:column;align-items:center;gap:14px}
.shutter{width:74px;height:74px;border-radius:50%;background:white;border:5px solid rgba(255,255,255,0.25);cursor:pointer}
.preview-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.4s}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="s-welcome" class="screen active">
  <div class="gem-logo">
    <svg viewBox="0 0 88 88" fill="none">
      <polygon points="44,8 76,24 76,64 44,80 12,64 12,24" fill="none" stroke="#c9a84c" stroke-width="1.2" opacity="0.35"/>
      <polygon points="44,16 66,28 66,60 44,72 22,60 22,28" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>
      <polygon points="44,24 58,32 58,56 44,64 30,56 30,32" fill="rgba(201,168,76,0.12)" stroke="#c9a84c" stroke-width="1.5"/>
    </svg>
  </div>
  <div class="brand">TrueColorGem</div>
  <div class="brand-sub">Gems Certification</div>
  <div class="tagline">The world standard for<br>authentic gemstone photography</div>
  <button class="btn btn-gold" onclick="show('s-login')">Seller Login</button>
  <button class="btn btn-outline" onclick="show('s-verify')">Verify a Purchase</button>
  <button class="btn btn-grey" onclick="show('s-plans')" style="margin-top:10px">View Plans</button>
</div>

<!-- LOGIN -->
<div id="s-login" class="screen">
  <div class="nav">
    <button class="nav-back" onclick="show('s-welcome')">←</button>
    <div class="nav-title">Sign In</div>
  </div>
  <div class="auth-content">
    <div class="auth-title">Welcome back</div>
    <div class="field"><label>Email</label><input type="email" id="login-email"></div>
    <div class="field"><label>Password</label><input type="password" id="login-pw"></div>
    <button class="btn btn-gold" onclick="doLogin()">Sign In</button>
    <button class="btn btn-grey" onclick="demoLogin()" style="margin-top:12px">Demo Login</button>
  </div>
</div>

<!-- CAMERA -->
<div id="s-camera" class="screen">
  <div class="nav" style="background:#000">
    <button class="nav-back" onclick="stopCamera();show('s-new')">←</button>
    <div class="nav-title">Live Photo</div>
  </div>
  <div class="cam-view">
    <video id="cam-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:none"></video>
    <canvas id="cam-canvas" style="display:none"></canvas>
    <canvas id="cam-analyze" width="80" height="80" style="display:none"></canvas>
    <div id="cam-placeholder" style="font-size:120px;opacity:0.2">💎</div>
    <div class="cam-overlay" id="cam-overlay">
      <div class="cam-frame"><span></span></div>
      <div class="light-ind">
        <div class="light-dot" id="light-dot" style="background:var(--grey)"></div>
        <div class="light-txt" id="light-txt">Starting camera...</div>
      </div>
    </div>
  </div>
  <div class="cam-bottom">
    <div class="cam-hint" id="cam-hint-main">Point camera at gemstone in natural daylight</div>
    <div class="shutter" id="shutter-btn" onclick="capturePhoto()" style="opacity:0.4"></div>
    <input type="file" id="cam-file" accept="image/*" capture="environment" onchange="handleCamFile(this)" style="display:none">
  </div>
</div>

<script>
// GLOBAL SHOW
window.show = function(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(id);
  if (target) target.classList.add('active');
  if (id === 's-camera') setTimeout(startCamera, 100);
};

let cameraStream = null;
let lightAnalysisInterval = null;
let lightOK = false;

async function startCamera() {
  const video = document.getElementById('cam-video');
  const placeholder = document.getElementById('cam-placeholder');
  const lightTxt = document.getElementById('light-txt');
  const lightDot = document.getElementById('light-dot');

  lightTxt.textContent = "Richiesta permesso...";
  lightDot.style.background = 'var(--yellow)';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    cameraStream = stream;
    video.srcObject = stream;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    video.playsInline = true;
    video.muted = true;

    await video.play();

    lightTxt.textContent = "Analisi luce in corso...";
    lightDot.style.background = 'var(--green)';
    startLightAnalysis();

  } catch (err) {
    console.error(err);
    lightTxt.textContent = "Errore permesso o fotocamera";
    lightDot.style.background = 'var(--red)';
    setTimeout(() => document.getElementById('cam-file').click(), 1500);
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
  }
  if (lightAnalysisInterval) clearInterval(lightAnalysisInterval);
}

function startLightAnalysis() {
  lightAnalysisInterval = setInterval(analyzeLightConditions, 600);
}

function analyzeLightConditions() {
  // Versione migliorata
  const video = document.getElementById('cam-video');
  const canvas = document.getElementById('cam-analyze');
  const ctx = canvas.getContext('2d');
  if (video.readyState < 2) return;

  ctx.drawImage(video, 0, 0, 80, 80);
  const data = ctx.getImageData(0, 0, 80, 80).data;

  let r=0, g=0, b=0, count=0, bright=0;
  for (let i = 0; i < data.length; i += 4) {
    r += data[i]; g += data[i+1]; b += data[i+2]; count++;
    const lum = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
    if (lum > 60 && lum < 220) bright++;
  }
  r /= count; g /= count; b /= count;
  const brightness = (r*0.299 + g*0.587 + b*0.114);
  const rbRatio = r / (b + 5);
  const uniformity = bright / count;

  const lightTxt = document.getElementById('light-txt');
  const lightDot = document.getElementById('light-dot');
  const shutter = document.getElementById('shutter-btn');

  if (brightness < 50 || brightness > 235 || rbRatio > 1.55 || rbRatio < 0.75 || uniformity < 0.65) {
    lightOK = false;
    lightDot.style.background = 'var(--yellow)';
    lightTxt.textContent = "Luce non ottimale ⚠️";
  } else {
    lightOK = true;
    lightDot.style.background = 'var(--green)';
    lightTxt.textContent = "Luce buona ✓";
  }
  shutter.style.opacity = lightOK ? '1' : '0.4';
}

function capturePhoto() {
  if (!lightOK) return;
  // ... (logica di cattura)
  toast("Foto catturata!");
  show('s-new');
}

// Demo functions
function demoLogin() { show('s-dashboard'); }
function doLogin() { show('s-dashboard'); }

document.addEventListener('DOMContentLoaded', () => {
  console.log('TrueColorGem loaded - ready for camera');
});
</script>
</body>
</html>
