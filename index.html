<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TrueColorGem</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* === CSS ORIGINALE (completo) === */
:root{--black:#080808;--dark:#111;--card:#181818;--card2:#202020;--gold:#c9a84c;--gold-light:#e8c96a;--gold-dim:#6a5020;--white:#f5f0e8;--grey:#777;--grey2:#444;--green:#4caf7d;--red:#e05555;--yellow:#f0c040}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:'Montserrat',sans-serif;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.btn{border:none;border-radius:2px;cursor:pointer;font-weight:600;letter-spacing:3px;text-transform:uppercase;padding:16px;width:100%;max-width:300px;margin:8px auto;display:block}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#000}
.cam-view{flex:1;background:#000;position:relative;overflow:hidden}
#cam-video{width:100%;height:100%;object-fit:cover;display:none}
.cam-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.light-dot{width:12px;height:12px;border-radius:50%}
.shutter{width:74px;height:74px;border-radius:50%;background:white;border:6px solid rgba(255,255,255,0.3);cursor:pointer}
</style>
</head>
<body>

<!-- WELCOME -->
<div id="s-welcome" class="screen active" style="text-align:center;padding:40px 20px">
  <div style="font-size:80px;margin-bottom:20px">💎</div>
  <div class="brand" style="font-size:42px;color:var(--gold)">TrueColorGem</div>
  <p style="margin:20px 0 40px">The world standard for<br>authentic gemstone photography</p>
  <button class="btn btn-gold" onclick="show('s-login')">Seller Login</button>
  <button class="btn" onclick="show('s-verify')" style="background:#333;color:white">Verify a Purchase</button>
  <button class="btn" onclick="show('s-plans')" style="background:#222;color:white">View Plans</button>
</div>

<!-- CAMERA SCREEN -->
<div id="s-camera" class="screen">
  <div class="nav" style="background:#000;color:white;padding:15px">
    <button onclick="stopCamera();show('s-new')" style="background:none;border:none;color:var(--gold);font-size:24px">←</button>
    <div style="flex:1;text-align:center">Live Photo</div>
  </div>
  
  <div class="cam-view">
    <video id="cam-video" autoplay playsinline muted></video>
    <div id="cam-placeholder" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:140px;opacity:0.25">💎</div>
    
    <div class="cam-overlay" id="cam-overlay">
      <div style="width:240px;height:240px;border:3px solid var(--gold);border-radius:8px;position:relative"></div>
      <div style="margin-top:30px;background:rgba(0,0,0,0.8);padding:12px 24px;border-radius:30px;display:flex;align-items:center;gap:12px">
        <div class="light-dot" id="light-dot" style="background:var(--yellow)"></div>
        <div id="light-txt" style="color:white">Opening camera...</div>
      </div>
    </div>
  </div>

  <div style="padding:20px 0;background:#111;text-align:center">
    <div class="shutter" id="shutter-btn" onclick="capturePhoto()"></div>
    <p id="cam-hint" style="margin-top:15px;color:#aaa">Point camera at gemstone in natural daylight</p>
  </div>

  <input type="file" id="cam-file" accept="image/*" capture="environment" onchange="handleCamFile(this)" style="display:none">
</div>

<script>
// ====================== GLOBAL ======================
window.show = function(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 's-camera') setTimeout(startCamera, 150);
};

let cameraStream = null;
let lightInterval = null;
let lightOK = false;

async function startCamera() {
  const video = document.getElementById('cam-video');
  const placeholder = document.getElementById('cam-placeholder');
  const lightTxt = document.getElementById('light-txt');
  const lightDot = document.getElementById('light-dot');

  try {
    lightTxt.textContent = "Richiesta permesso fotocamera...";
    lightDot.style.background = 'var(--yellow)';

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: "environment",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });

    cameraStream = stream;
    video.srcObject = stream;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    video.playsInline = true;
    video.muted = true;

    // Forza il caricamento sul mobile
    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
      video.play().catch(() => {});
    });

    lightTxt.textContent = "Fotocamera attiva ✓";
    lightDot.style.background = 'var(--green)';
    startLightAnalysis();

  } catch (err) {
    console.error("Camera Error:", err.name, err.message);
    
    let msg = "Impossibile aprire la fotocamera";
    if (err.name === "NotAllowedError") msg = "Permesso negato. Tocca 'Consenti'";
    else if (err.name === "NotReadableError") msg = "Fotocamera già in uso";
    else if (err.name === "SecurityError") msg = "Apri in HTTPS";

    lightTxt.textContent = msg;
    lightDot.style.background = 'var(--red)';

    // Fallback galleria
    setTimeout(() => {
      document.getElementById('cam-file').click();
    }, 1800);
  }
}

function startLightAnalysis() {
  lightInterval = setInterval(() => {
    // Analisi semplificata
    const dot = document.getElementById('light-dot');
    dot.style.background = 'var(--green)';
  }, 700);
}

function stopCamera() {
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  if (lightInterval) clearInterval(lightInterval);
}

function capturePhoto() {
  if (lightOK) {
    toast("Foto catturata con successo!");
    show('s-welcome');
  } else {
    toast("Luce non ottimale. Riprova.");
  }
}

function handleCamFile(input) {
  if (input.files[0]) {
    toast("Foto dalla galleria caricata (demo)");
    show('s-welcome');
  }
}

function toast(msg) {
  alert(msg);
}

// Demo
document.addEventListener('DOMContentLoaded', () => {
  console.log("%cTrueColorGem - Versione mobile ottimizzata", "color:#c9a84c;font-weight:bold");
});
</script>
</body>
</html>
